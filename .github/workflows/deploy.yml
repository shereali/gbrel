name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Support both raw private key (PEM / OpenSSH) and base64-encoded key
          if echo "$SSH_KEY" | grep -q -- "-----BEGIN"; then
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          fi

          chmod 600 ~/.ssh/deploy_key

          # Validate key syntax early with clear error feedback
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || {
            echo "::error::SSH key is invalid or corrupted. Check secrets.VPS_SSH_KEY format."
            exit 1
          }

          echo "DEPLOY KEY FILE SHA256: $(sha256sum ~/.ssh/deploy_key | cut -d' ' -f1)"

          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection & diagnose
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          echo "========================================================"
          echo "DEPLOY PUBLIC KEY (Verify this is in ~/.ssh/authorized_keys on VPS):"
          ssh-keygen -y -f ~/.ssh/deploy_key
          echo "========================================================"

          if ! ssh -i ~/.ssh/deploy_key \
                  -p "$PORT" \
                  -o StrictHostKeyChecking=accept-new \
                  -o IdentitiesOnly=yes \
                  -o ConnectTimeout=15 \
                  -o BatchMode=yes \
                  "$USER@$HOST" "echo Connected as user: \$(whoami)"; then
            echo ""
            echo "::error::SSH Connection failed. See diagnosis details below."
            echo "=== TROUBLESHOOTING CHECKLIST ==="
            echo "1. The public key above MUST be present in /home/$USER/.ssh/authorized_keys on your VPS."
            echo "2. On your VPS, run: chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys"
            echo "3. Ensure VPS_USER exactly matches the Linux username on the server."
            echo ""
            echo "=== Verbose SSH Logs (ssh -vvv) ==="
            ssh -vvv -i ~/.ssh/deploy_key \
                -p "$PORT" \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=10 \
                -o BatchMode=yes \
                "$USER@$HOST" "true" 2>&1 | tail -n 35 || true
            exit 1
          fi

      - name: Execute Deploy Script
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')

          ssh -i ~/.ssh/deploy_key \
              -p "$PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 \
              "$USER@$HOST" \
              "APP_DIR=\$( [ -d /var/www/gbrel ] && echo /var/www/gbrel || echo /var/www/gangchil ); bash \$APP_DIR/deploy/deploy.sh"

      - name: Collect Server Diagnostics
        if: always()
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')

          ssh -i ~/.ssh/deploy_key \
              -p "$PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 \
              "$USER@$HOST" \
              "APP_DIR=\$( [ -d /var/www/gbrel ] && echo /var/www/gbrel || echo /var/www/gangchil );
              echo '=== ALL DOCKER CONTAINERS ===';
              docker ps -a;
              echo '';
              echo '=== DOCKER COMPOSE PS ===';
              cd \$APP_DIR && docker compose ps;
              echo '';
              echo '=== BACKEND LOGS ===';
              cd \$APP_DIR && docker compose logs --tail=80 backend;
              echo '';
              echo '=== DB LOGS ===';
              cd \$APP_DIR && docker compose logs --tail=30 db;
              echo '';
              echo '=== INTERNAL CURL HOST PORTS ===';
              curl -sS -i --max-time 5 http://127.0.0.1:8004/up || echo 'Port 8004 failed';
              echo '';
              curl -sS -i --max-time 5 http://127.0.0.1:3004/ || echo 'Port 3004 failed';
              echo '';
              echo '=== CADDY STATUS & CONFIG ===';
              ls -la /opt/caddy/conf.d/ 2>/dev/null || true;
              cat /opt/caddy/conf.d/gbrel.caddy 2>/dev/null || cat /opt/caddy/conf.d/gangchil.caddy 2>/dev/null || true;
              echo '';
              echo '=== MAIN CADDYFILE ===';
              cat /opt/caddy/Caddyfile 2>/dev/null || cat /etc/caddy/Caddyfile 2>/dev/null || true;
              echo '';
              echo '=== CADDY_NET NETWORK INSPECT ===';
              docker network inspect caddy_net 2>/dev/null || true;
              echo '';
              echo '=== DB VOLUME DETAILS ===';
              docker volume ls | grep -E 'db|mysql|gbrel|gangchil' || true;
              " 2>&1 | tee server_diagnostics.txt || true

      - name: Upload Server Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-diagnostics
          path: server_diagnostics.txt

      - name: Push Diagnostics to Git
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b diagnostics 2>/dev/null || git checkout diagnostics || true
          git add -f server_diagnostics.txt
          git commit -m "Update server diagnostics [skip ci]" || true
          git push -f origin diagnostics || true

      - name: Verify Live Services
        run: |
          echo "Waiting 5 seconds..."
          sleep 5
          echo "Checking https://gbrel.com/api/health..."
          curl -sS -i --max-time 15 "https://gbrel.com/api/health" || echo "Health check curl warning"
          echo "Checking https://gbrel.com/api/properties..."
          curl -sS -i --max-time 15 "https://gbrel.com/api/properties" | head -n 25 || echo "API check curl warning"
          echo "Checking https://gbrel.com/..."
          curl -sS -i --max-time 15 "https://gbrel.com/" | head -n 15 || echo "Frontend check curl warning"
